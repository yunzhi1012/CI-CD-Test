# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci  # ci比install更快更严格
    
    - name: Lint check
      run: npm run lint
    
    - name: Type check
      run: npm run type-check  # vue-tsc --noEmit
    
    # - name: Unit test
      # run: npm run test:unit
    
    - name: Build
      run: npm run build
    
    - name: Upload artifact  # 保存构建产物
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

     # 新增：部署到 GitHub Pages
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'  # 只在 main 分支部署
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages  # 部署到 gh-pages 分支
